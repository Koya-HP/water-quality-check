<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水質チェック記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 現場で片手で使う、静かで確かな記録帳
   IDEA: 養殖池のそばに置く防水の測定ノート
   PICTURE: 入力フォームそのもの（各項目が即座に適正/範囲外を表示）
   COLOUR and TYPE: 深い水の青緑 + ひまわりの黄色アクセント / Zen Kaku Gothic New
   LAYOUT: 上に最新値の帯、タブで「記録・履歴・グラフ・基準値」 */
:root{color-scheme:light dark;
--bg:light-dark(#f6f8f7,#0e1716);--card:light-dark(#fff,#162321);--ink:light-dark(#13201f,#e6efed);
--mute:light-dark(#5d6d6b,#9db0ad);--line:light-dark(#dde5e3,#26403c);
--sea:light-dark(#0d5c63,#0b4a50);--seaink:#fff;--sun:#f2b705;--ok:light-dark(#1d7a4f,#5fd39a);
--okbg:light-dark(#e3f4ea,#173a2a);--ng:light-dark(#b4410f,#ff9a66);--ngbg:light-dark(#fdeadf,#40261a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
   [hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip}
header{background:var(--sea);color:var(--seaink);padding:18px max(4vw,16px) 0}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1000px;margin:0 auto}
h1{font-size:24px;line-height:1.1;margin:0;font-weight:700}
.dot{width:30px;height:30px;border-radius:50%;background:var(--sun);box-shadow:0 0 0 5px rgba(242,183,5,.25);flex:none}
.status{margin-left:auto;font-size:13px;opacity:.85}
.latest{max-width:1000px;margin:14px auto 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:14px}
.lt{flex:none;background:rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;min-width:92px}
.lt b{display:block;font-size:20px;font-variant-numeric:tabular-nums;line-height:1.2}
.lt small{font-size:13px;opacity:.85}.lt.ng{box-shadow:inset 0 -3px 0 var(--sun)}
nav{display:flex;gap:4px;max-width:1000px;margin:0 auto;overflow-x:auto}
nav button{flex:none;background:none;border:0;color:var(--seaink);opacity:.75;font:inherit;font-weight:700;padding:12px 16px;min-height:44px;border-radius:10px 10px 0 0;cursor:pointer}
nav button[aria-selected=true]{background:var(--bg);color:var(--ink);opacity:1}
main{max-width:1000px;margin:0 auto;padding:20px max(4vw,16px) 60px}
section[hidden]{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:4px;font-weight:500}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--sun);outline-offset:1px}
.items{margin:18px 0;border:1px solid var(--line);border-radius:16px;padding:6px 16px 10px}
.chk{display:flex;align-items:center;gap:12px;padding:10px 0 6px;font-size:19px;font-weight:700}
.chk i{width:40px;height:40px;border-radius:50%;background:#c6c24e;display:grid;place-items:center;color:#fff;font-style:normal;font-size:20px}
.tag{display:inline-block;font-size:12px;font-weight:700;color:var(--sea);background:light-dark(#d6ecea,#173a37);border-radius:99px;padding:1px 9px;margin-left:6px;vertical-align:1px}
.it{border-bottom:1px dotted var(--line);padding:10px 4px;display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:2px 10px;align-items:center}
.it:last-child{border-bottom:0}
.it .nm{font-weight:700;font-size:15px}
.it .rg{font-size:13px;color:var(--mute);grid-column:1}
.it .in{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:6px}
.it input{text-align:right;font-variant-numeric:tabular-nums;padding:8px;font-size:20px;font-weight:700}
.it.cur{outline:3px solid var(--sun);outline-offset:-1px;border-radius:10px}
.pad{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -10px 30px rgba(0,0,0,.18);padding:12px max(4vw,12px) calc(12px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .2s}
.pad.on{transform:none}
.pad .ph{display:flex;align-items:baseline;gap:10px;max-width:520px;margin:0 auto 8px}
.pad .ph b{font-size:15px}.pad .ph output{margin-left:auto;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.pad .ph small{color:var(--mute)}
.keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:520px;margin:0 auto}
.keys button{min-height:54px;font:inherit;font-size:22px;font-weight:700;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);cursor:pointer;touch-action:manipulation}
.keys button:active{background:var(--line)}
.keys .s{font-size:15px}.keys .go{background:var(--sea);color:#fff;border:0}.keys .pm{color:var(--sea)}
body.padon main{padding-bottom:380px}
.it .u{font-size:13px;color:var(--mute);white-space:nowrap;width:3.2em}
.it.ok{border-color:var(--ok);background:var(--okbg)}.it.ng{border-color:var(--ng);background:var(--ngbg)}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:1px}
.ok .badge,.badge.ok{color:var(--ok);background:var(--okbg)}.ng .badge,.badge.ng{color:var(--ng);background:var(--ngbg)}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;min-height:48px;padding:0 22px;cursor:pointer;background:var(--sea);color:#fff}
.btn.sub{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:var(--ng);color:#fff}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.msg{font-size:14px;color:var(--ok);font-weight:700}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.filters>*{flex:1 1 180px}
.rec{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.rh{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline}
.rh b{font-size:17px}.rh span{color:var(--mute);font-size:14px}
.vals{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.v{font-size:14px;border-radius:8px;padding:3px 9px;background:var(--bg);border:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
.v.ng{border-color:var(--ng);color:var(--ng);background:var(--ngbg)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px dotted var(--line)}
.kv span{color:var(--mute)}.kv b{font-weight:500;text-align:right}
.rec .items{margin:14px 0 6px}.rec .it{grid-template-columns:minmax(0,1fr) auto}
.rv{white-space:nowrap;text-align:right}.rv b{font-size:22px;font-variant-numeric:tabular-nums}.rv small{color:var(--mute)}
.memo{font-size:14px;color:var(--mute);margin:6px 0 0;white-space:pre-wrap}
.ra{display:flex;gap:8px;margin-top:8px}.ra button{min-height:40px;padding:0 14px;font-size:14px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.fig{position:relative;min-height:320px;margin-top:12px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.legend{font-size:13px;color:var(--mute);margin-top:8px}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
td input{min-height:40px;padding:6px 8px;text-align:right}
.note{font-size:13px;color:var(--mute)}
textarea.csv{min-height:140px;font-size:13px;margin-top:10px}
@media(max-width:700px){.items{grid-template-columns:minmax(0,1fr)}.row{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.row>div:first-child{grid-column:1/-1}}
@media(prefers-reduced-motion:no-preference){.it{transition:background .2s,border-color .2s}}
</style>
</head>
<body>
<header>
  <div class="top"><span class="dot" aria-hidden="true"></span><h1>水質チェック記録</h1><span class="status" id="status">読み込み中…</span></div>
  <div class="latest" id="latest" aria-label="最新の測定値"></div>
  <nav role="tablist">
    <button role="tab" data-v="input" aria-selected="true">記録する</button>
    <button role="tab" data-v="history" aria-selected="false">履歴</button>
    <button role="tab" data-v="chart" aria-selected="false">グラフ</button>
    <button role="tab" data-v="settings" aria-selected="false">基準値・設定</button>
  </nav>
</header>
<main>
<section id="v-input">
  <form class="card" id="form" autocomplete="off">
    <div class="row">
      <div><label for="f-place">場所・水槽</label><select id="f-place" required></select></div>
      <div><label for="f-date">日付</label><input id="f-date" type="date" required></div>
      <div><label for="f-time">時刻</label><input id="f-time" type="time" required></div>
    </div>
    <div style="margin-top:12px"><label for="f-member">メンバー（測定者）</label><input id="f-member" placeholder="例：坂西" required></div>
    <datalist id="places"></datalist>
    <div class="items" id="items"></div>
    <label for="f-memo">メモ（気づいたこと・対応したこと）</label>
    <textarea id="f-memo" rows="3" placeholder="例：魚の食いつき良好。換水 20L 実施"></textarea>
    <div class="acts">
      <button class="btn" type="submit" id="save">保存する</button>
      <button class="btn sub" type="button" id="cancel" hidden>編集をやめる</button>
      <span class="msg" id="msg" role="status"></span>
    </div>
  </form>
</section>

<section id="v-history" hidden>
  <div class="filters">
    <select id="h-place" aria-label="場所で絞り込み"></select>
    <select id="h-only" aria-label="表示">
      <option value="all">すべての記録</option><option value="ng">範囲外がある記録だけ</option>
    </select>
  </div>
  <div id="list"></div>
  <div class="acts"><button class="btn sub" id="csv">CSVをコピー（Excel用）</button><span class="msg" id="csvmsg"></span></div>
  <textarea class="csv" id="csvbox" hidden readonly aria-label="CSV"></textarea>
</section>

<section id="v-chart" hidden>
  <div class="card">
    <div class="row">
      <div><label for="c-item">項目</label><select id="c-item"></select></div>
      <div><label for="c-place">場所</label><select id="c-place"></select></div>
      <div><label for="c-n">期間</label><select id="c-n"><option value="14">直近14回</option><option value="30" selected>直近30回</option><option value="90">直近90回</option></select></div>
    </div>
    <div class="fig"><svg id="svg" role="img" aria-label="推移グラフ"></svg></div>
    <p class="legend">緑の帯＝基準範囲。オレンジの点＝範囲外。</p>
  </div>
</section>

<section id="v-settings" hidden>
  <div class="card">
    <h2 style="font-size:20px;margin:0 0 4px">基準値（適正範囲）</h2>
    <p class="note">初期値は一般的なアクアポニックスの目安です。農場で決めている基準に書き換えてください。空欄は「上限なし／下限なし」。</p>
    <table><thead><tr><th>項目</th><th>下限</th><th>上限</th></tr></thead><tbody id="rtable"></tbody></table>
    <h2 style="font-size:20px;margin:22px 0 4px">場所・水槽の候補</h2>
    <p class="note">1行に1つ。入力画面で選べるようになります。</p>
    <textarea id="s-places" rows="4"></textarea>
    <div class="acts"><button class="btn" id="s-save">設定を保存</button><span class="msg" id="smsg"></span></div>
  </div>
</section>
</main>

<script>
{
const ITEMS=[
 {k:'nh3',st:0.25,n:'水中アンモニア [NH3]',s:'NH3',u:'mg/L',lo:0,hi:1,main:1},
 {k:'no2',st:0.25,n:'水中 亜硝酸塩 [NO2-]',s:'NO2',u:'mg/L',lo:0,hi:1,main:1},
 {k:'no3',st:10,n:'水中 硝酸態窒素 [NO3-N]',s:'NO3-N',u:'mg/L',lo:5,hi:150,main:1},
 {k:'k',st:1,n:'水中カリウム [K+]',s:'K+',u:'mg/L',lo:10,hi:40,main:1},
 {k:'ca',st:10,n:'水中カルシウム [Ca2+]',s:'Ca2+',u:'mg/L',lo:20,hi:150,main:1},
 {k:'ph',st:0.1,n:'水中pH',s:'pH',u:'pH',lo:6.0,hi:7.5,main:1},
 {k:'temp',st:0.5,n:'水温',s:'水温',u:'℃',lo:18,hi:30,main:1}
];
/* ▼ Google Apps Script の「ウェブアプリURL」をここに貼る */
const GAS_URL='';
const DEF_PLACES=['三浦市サンフラワーファーム','アクアポニックスカフェ'];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let records=[],settings={ranges:{},places:DEF_PLACES.slice()},db=null,editId=null,canWrite=true;

const rng=k=>{const it=ITEMS.find(i=>i.k===k),r=settings.ranges?.[k]||{};return{lo:'lo' in r?r.lo:it.lo,hi:'hi' in r?r.hi:it.hi}};
const judge=(k,v)=>{if(v===''||v==null||isNaN(v))return'';const{lo,hi}=rng(k);if(lo!=null&&v<lo)return'ng';if(hi!=null&&v>hi)return'ng';return(lo==null&&hi==null)?'':'ok'};
const rtext=k=>{const{lo,hi}=rng(k);if(lo==null&&hi==null)return'基準なし';if(lo==null)return hi+' 以下';if(hi==null)return lo+' 以上';return lo+' 〜 '+hi};
const fmtD=r=>{const d=new Date(r.ts);return`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}（${'日月火水木金土'[d.getDay()]}）`};
const fmtT=r=>{const d=new Date(r.ts);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const places=()=>{const s=new Set(settings.places||[]);records.forEach(r=>r.place&&s.add(r.place));return[...s]};

/* ---------- タブ ---------- */
const views=['input','history','chart','settings'];
function show(v){views.forEach(x=>{$('v-'+x).hidden=x!==v});document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===v));if(v==='chart')drawChart()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));

/* ---------- 入力フォーム ---------- */
$('items').innerHTML='<div class="chk"><i aria-hidden="true">⚗</i>環境チェック</div>'+ITEMS.map(i=>`<div class="it" id="it-${i.k}"><div class="nm">${esc(i.n)}<span class="tag">環境</span><span class="badge" id="b-${i.k}" hidden></span></div><div class="rg" id="rg-${i.k}"></div><div class="in"><input id="f-${i.k}" type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" aria-label="${esc(i.n)}"><span class="u">${esc(i.u)}</span></div></div>`).join('');
function paintItem(k){const raw=$('f-'+k).value,v=raw===''?'':Number(raw),j=judge(k,v),box=$('it-'+k),b=$('b-'+k);box.className='it '+j;b.hidden=!j;b.textContent=j==='ok'?'適正':'範囲外';$('rg-'+k).textContent='基準 '+rtext(k)}
const z2h=t=>t.replace(/[０-９．]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0)).replace(/。|、/g,'.').replace(/[^0-9.\-]/g,'');
ITEMS.forEach((it,i)=>{const el=$('f-'+it.k);
  el.addEventListener('input',()=>{const c=z2h(el.value);if(c!==el.value)el.value=c;paintItem(it.k)});
  const go=()=>{const c=z2h(el.value);if(c!==el.value){el.value=c;paintItem(it.k)}const nx=ITEMS[i+1];nx?$('f-'+nx.k).focus():$('f-memo').focus()};
  let pend=false;
  el.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.keyCode!==13&&e.keyCode!==229)return;
    if(e.isComposing||e.keyCode===229){if(e.key==='Enter'||e.keyCode===229)pend=e.key==='Enter';return}
    e.preventDefault();go()});
  el.addEventListener('compositionend',()=>{if(pend){pend=false;setTimeout(()=>{const c=z2h(el.value);if(c!==el.value){el.value=c;paintItem(it.k)}},0)}})});
function resetForm(){const d=new Date();$('f-date').value=d.toLocaleDateString('sv-SE');$('f-time').value=d.toTimeString().slice(0,5);ITEMS.forEach(i=>{$('f-'+i.k).value='';paintItem(i.k)});$('f-memo').value='';$('f-place').value=ls.get('wq_place',DEF_PLACES[0]);$('f-member').value=ls.get('wq_member','');editId=null;$('save').textContent='保存する';$('cancel').hidden=true}
function loadForm(r){show('input');editId=r.id;const d=new Date(r.ts);$('f-date').value=d.toLocaleDateString('sv-SE');$('f-time').value=fmtT(r);$('f-place').value=r.place||'';$('f-member').value=r.member||'';$('f-memo').value=r.memo||'';ITEMS.forEach(i=>{const v=r.v?.[i.k];$('f-'+i.k).value=v==null?'':v;paintItem(i.k)});$('save').textContent='更新する';$('cancel').hidden=false;window.scrollTo({top:0})}
$('cancel').onclick=resetForm;
$('form').addEventListener('submit',async e=>{e.preventDefault();
  const v={};ITEMS.forEach(i=>{const x=$('f-'+i.k).value;if(x!=='')v[i.k]=Number(x)});
  if(!Object.keys(v).length){flash('msg','測定値を1つ以上入力してください',true);return}
  const ts=new Date($('f-date').value+'T'+$('f-time').value).getTime();
  const rec={ts,place:$('f-place').value.trim(),member:$('f-member').value.trim(),v,memo:$('f-memo').value.trim(),updated:Date.now()};
  ls.set('wq_member',rec.member);ls.set('wq_place',rec.place);
  $('save').disabled=true;
  try{await saveRec(editId||('r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),rec);flash('msg',editId?'更新しました':'保存しました');resetForm()}
  catch(err){flash('msg',errText(err),true)}
  $('save').disabled=false});
function flash(id,t,bad){const m=$(id);m.textContent=t;m.style.color=bad?'var(--ng)':'var(--ok)';clearTimeout(m._t);m._t=setTimeout(()=>m.textContent='',4000)}
const errText=e=>'保存できませんでした。電波を確認してもう一度お試しください';

/* ---------- 保存先（共有DB / この端末） ---------- */
async function api(body){const r=await fetch(GAS_URL,{method:'POST',body:JSON.stringify(body)});if(!r.ok)throw new Error('http');const j=await r.json();if(!j.ok)throw new Error(j.error||'ng');apply(j);return j}
function apply(j){records=(j.records||[]).sort((a,b)=>b.ts-a.ts);if(j.settings)settings={ranges:{},places:DEF_PLACES.slice(),...j.settings};ls.set('wq_cache',{records,settings});renderSettings();renderAll()}
async function saveRec(id,rec){if(GAS_URL)return api({action:'save',rec:{id,...rec}});const i=records.findIndex(r=>r.id===id);const r={id,...rec};i>=0?records[i]=r:records.push(r);records.sort((a,b)=>b.ts-a.ts);ls.set('wq_records',records);renderAll()}
async function delRec(id){if(GAS_URL)return api({action:'delete',id});records=records.filter(r=>r.id!==id);ls.set('wq_records',records);renderAll()}
async function saveSettings(st){if(GAS_URL)return api({action:'settings',settings:st});settings=st;ls.set('wq_settings',st);renderAll()}

/* ---------- 最新値・履歴 ---------- */
function renderLatest(){const r=records[0];if(!r){$('latest').innerHTML='<div class="lt"><small>まだ記録がありません</small></div>';return}
  $('latest').innerHTML=`<div class="lt"><small>最新</small><b style="font-size:15px">${esc(fmtD(r))}</b><small>${esc(fmtT(r))} ${esc(r.member||'')}</small></div>`+ITEMS.filter(i=>r.v?.[i.k]!=null).map(i=>`<div class="lt ${judge(i.k,r.v[i.k])}"><small>${esc(i.s)}</small><b>${esc(r.v[i.k])}</b><small>${esc(i.u)}</small></div>`).join('')}
function fillSelect(sel,opts,keep){const cur=sel.value;sel.innerHTML=opts.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('');if(keep&&[...sel.options].some(o=>o.value===cur))sel.value=cur}
function renderList(){const p=$('h-place').value,only=$('h-only').value;
  const rows=records.filter(r=>(!p||r.place===p)&&(only!=='ng'||ITEMS.some(i=>judge(i.k,r.v?.[i.k])==='ng')));
  if(!rows.length){$('list').innerHTML='<div class="empty">記録はまだありません。<br>「記録する」タブから最初の測定を入力しましょう。</div>';return}
  $('list').innerHTML=rows.map(r=>{const filled=ITEMS.filter(i=>r.v?.[i.k]!=null),miss=ITEMS.length-filled.length;return`<article class="rec">
   <div class="kv"><span>日付</span><b>${esc(fmtD(r))} ${esc(fmtT(r))}</b></div>
   <div class="kv"><span>場所</span><b>${esc(r.place||'')}</b></div>
   <div class="kv"><span>メンバー</span><b>${esc(r.member||'')}</b></div>
   <div class="items"><div class="chk"><i aria-hidden="true">⚗</i>環境チェック</div>
   ${filled.map(i=>{const j=judge(i.k,r.v[i.k]);return`<div class="it ${j}"><div class="nm">${esc(i.n)}<span class="tag">環境</span>${j?`<span class="badge">${j==='ok'?'適正':'範囲外'}</span>`:''}</div><div class="rv"><b>${esc(r.v[i.k])}</b> <small>${esc(i.u)}</small></div></div>`}).join('')}
   ${miss?`<p class="note" style="margin:8px 0 0">未記入の項目 <span class="tag">${miss}</span></p>`:''}</div>
   ${r.memo?`<p class="memo">${esc(r.memo)}</p>`:''}
   ${canWrite?`<div class="ra"><button class="btn sub" data-e="${esc(r.id)}">編集</button><button class="btn sub" data-d="${esc(r.id)}">削除</button></div>`:''}</article>`}).join('')}
$('list').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.e){const r=records.find(x=>x.id===b.dataset.e);if(r)loadForm(r);return}
  if(b.dataset.d){if(!b.classList.contains('warn')){b.classList.add('warn');b.classList.remove('sub');b.textContent='本当に削除？';setTimeout(()=>{if(b.isConnected){b.classList.remove('warn');b.classList.add('sub');b.textContent='削除'}},4000);return}
    try{await delRec(b.dataset.d)}catch(err){alertMsg(err)}}});
function alertMsg(err){flash('csvmsg',errText(err),true)}
$('h-place').onchange=renderList;$('h-only').onchange=renderList;
$('csv').onclick=async()=>{const head=['日付','時刻','場所','メンバー',...ITEMS.map(i=>`${i.n}(${i.u})`),'メモ'];
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const csv=[head.map(q).join(','),...records.slice().reverse().map(r=>[fmtD(r),fmtT(r),r.place,r.member,...ITEMS.map(i=>r.v?.[i.k]??''),r.memo].map(q).join(','))].join('\n');
  try{await navigator.clipboard.writeText(csv);flash('csvmsg','コピーしました。Excelやスプレッドシートに貼り付けできます')}
  catch(e){$('csvbox').hidden=false;$('csvbox').value=csv;$('csvbox').select();flash('csvmsg','下の欄を全選択してコピーしてください')}};

/* ---------- グラフ ---------- */
const svg=$('svg');
function drawChart(){if($('v-chart').hidden)return;const k=$('c-item').value,p=$('c-place').value,n=+$('c-n').value,it=ITEMS.find(i=>i.k===k);
  const pts=records.filter(r=>(!p||r.place===p)&&r.v?.[k]!=null).slice(0,n).reverse();
  const W=svg.clientWidth,H=svg.clientHeight;if(!W)return;
  if(pts.length<1){svg.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" fill="currentColor" opacity=".6" font-size="15">${esc(it.n)}の記録がまだありません</text>`;return}
  const L=46,R=14,T=16,B=34,{lo,hi}=rng(k);const vs=pts.map(r=>r.v[k]);
  let mn=Math.min(...vs,lo??Infinity),mx=Math.max(...vs,hi??-Infinity);if(mn===mx){mn-=1;mx+=1}const pad=(mx-mn)*.08;mn-=pad;mx+=pad;
  const x=i=>pts.length===1?(L+W-R)/2:L+i*(W-L-R)/(pts.length-1),y=v=>T+(1-(v-mn)/(mx-mn))*(H-T-B);
  let s='';
  if(lo!=null||hi!=null){const y1=y(hi??mx),y2=y(lo??mn);s+=`<rect x="${L}" y="${y1}" width="${W-L-R}" height="${Math.max(0,y2-y1)}" fill="var(--ok)" opacity=".12"/>`}
  for(let g=0;g<=4;g++){const v=mn+(mx-mn)*g/4,yy=y(v);s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end" font-size="12" fill="var(--mute)">${+v.toFixed(v<10?2:0)}</text>`}
  s+=`<polyline fill="none" stroke="var(--sea)" stroke-width="2.5" points="${pts.map((r,i)=>x(i)+','+y(r.v[k])).join(' ')}"/>`;
  const step=Math.ceil(pts.length/(W<520?4:8));
  pts.forEach((r,i)=>{const j=judge(k,r.v[k]);s+=`<circle cx="${x(i)}" cy="${y(r.v[k])}" r="5" fill="${j==='ng'?'var(--ng)':'var(--sea)'}" stroke="var(--card)" stroke-width="2"><title>${esc(fmtD(r)+' '+fmtT(r)+'  '+r.v[k]+' '+it.u)}</title></circle>`;
    if(i%step===0||i===pts.length-1){const d=new Date(r.ts);s+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="12" fill="var(--mute)">${d.getMonth()+1}/${d.getDate()}</text>`}});
  svg.innerHTML=s}
const ro=new ResizeObserver(drawChart);ro.observe(svg);
['c-item','c-place','c-n'].forEach(id=>$(id).onchange=drawChart);

/* ---------- 設定 ---------- */
function renderSettings(){$('rtable').innerHTML=ITEMS.map(i=>{const{lo,hi}=rng(i.k);return`<tr><td>${esc(i.n)} <span class="note">${esc(i.u)}</span></td><td><input type="number" step="any" inputmode="decimal" id="lo-${i.k}" value="${lo??''}" aria-label="${esc(i.n)} 下限"></td><td><input type="number" step="any" inputmode="decimal" id="hi-${i.k}" value="${hi??''}" aria-label="${esc(i.n)} 上限"></td></tr>`}).join('');
  $('s-places').value=(settings.places||[]).join('\n')}
$('s-save').onclick=async()=>{const ranges={};ITEMS.forEach(i=>{const a=$('lo-'+i.k).value,b=$('hi-'+i.k).value;ranges[i.k]={lo:a===''?null:+a,hi:b===''?null:+b}});
  const pl=$('s-places').value.split('\n').map(s=>s.trim()).filter(Boolean);
  try{await saveSettings({ranges,places:pl.length?pl:DEF_PLACES.slice()});flash('smsg','保存しました')}catch(e){flash('smsg',errText(e),true)}};

function renderAll(){renderLatest();const pl=places();const fp=$('f-place'),fcur=fp.value||ls.get('wq_place',pl[0]);fillSelect(fp,pl.map(p=>[p,p]));if(pl.includes(fcur))fp.value=fcur;
  $('places').innerHTML=pl.map(p=>`<option value="${esc(p)}">`).join('');
  fillSelect($('h-place'),[['','すべての場所'],...pl.map(p=>[p,p])],true);
  fillSelect($('c-place'),[['','すべての場所'],...pl.map(p=>[p,p])],true);
  renderList();ITEMS.forEach(i=>paintItem(i.k));drawChart()}
fillSelect($('c-item'),ITEMS.map(i=>[i.k,i.n]));$('c-item').value='no3';

/* ---------- 起動 ---------- */
resetForm();renderAll();renderSettings();
if(!GAS_URL){records=ls.get('wq_records',[]);settings=ls.get('wq_settings',settings);$('status').textContent='この端末だけに保存中（共有先が未設定）';renderSettings();renderAll()}
else{
  const c=ls.get('wq_cache',null);if(c){records=c.records||[];if(c.settings)settings={ranges:{},places:DEF_PLACES.slice(),...c.settings};renderSettings();renderAll()}
  let busy=false;
  const load=async()=>{if(busy)return;busy=true;$('status').textContent='読み込み中…';
    try{const r=await fetch(GAS_URL+'?t='+Date.now());const j=await r.json();apply(j);$('status').textContent='みんなで共有中'}
    catch(e){$('status').textContent='共有データにつながりません（電波を確認）'}busy=false};
  load();setInterval(()=>{if(!document.hidden&&!editId)load()},60000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
}
}
</script>
</body>
